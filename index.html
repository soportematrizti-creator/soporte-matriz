<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX_OS // Ticket Classification Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020813;
            --blue-glow: #00d9ff;
            --blue-cyan: #0077ff;
            --pink-neon: #ff0055;
            --card-bg: rgba(6, 18, 38, 0.7);
            --border-glow: rgba(0, 217, 255, 0.3);
            --text-main: #e0f7fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 217, 255, 0.1) 0%, transparent 70%),
                linear-gradient(to bottom, rgba(2, 8, 19, 0.9), rgba(2, 8, 19, 0.95));
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.15);
            padding: 25px;
            border-radius: 4px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 15px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--blue-glow);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .brand span {
            color: #ffffff;
        }

        .btn-sync {
            background: transparent;
            border: 1px solid var(--blue-glow);
            color: var(--blue-glow);
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sync:hover {
            background: var(--blue-glow);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
        }

        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(2, 12, 27, 0.8);
            border: 1px solid var(--border-glow);
            padding: 14px 20px 14px 45px;
            color: #fff;
            font-size: 18px;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--blue-glow);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
        }

        .input-wrapper::before {
            content: "🔍";
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }

        .btn-clear {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--pink-neon);
            color: var(--pink-neon);
            padding: 0 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: var(--pink-neon);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        .stats-bar {
            display: flex;
            gap: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #8ab4f8;
        }

        .stats-bar span {
            color: var(--blue-glow);
            font-weight: 700;
        }

        .table-container {
            border: 1px solid var(--border-glow);
            overflow-x: auto;
            background: rgba(2, 8, 19, 0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 217, 255, 0.08);
            color: var(--blue-glow);
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            padding: 15px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-glow);
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid rgba(0, 217, 255, 0.1);
            font-size: 16px;
        }

        tr:hover {
            background: rgba(0, 217, 255, 0.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            font-family: 'Orbitron', sans-serif;
            color: var(--blue-glow);
            letter-spacing: 2px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand">
                ⚡ MATRIX_OS <span>// PROACTIVANET MATRIX</span>
            </div>
            <button class="btn-sync" onclick="sincronizarBase()">
                🔄 SINCRONIZAR BASE
            </button>
        </div>

        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="searchInput" placeholder="Escribe para buscar (ej: conciliacion bancaria)..." oninput="ejecutarBusqueda()">
            </div>
            <button class="btn-clear" onclick="limpiarBusqueda()">💥 LIMPIAR</button>
        </div>

        <div class="stats-bar">
            <div>TOTAL REGISTROS: <span id="totalRegistros">0</span></div>
            <div>|</div>
            <div>COINCIDENCIAS: <span id="coincidencias">0</span></div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>NOMBRE</th>
                        <th>RUTA COMPLETA</th>
                        <th>GRUPO RESOLUTOR</th>
                        <th>IMPACTO POR DEFECTO</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo"></tbody>
            </table>
            <div id="sinResultados" class="empty-state" style="display: none;">
                NO SE ENCONTRARON COINCIDENCIAS
            </div>
        </div>
    </div>

    <script>
        // Si consumes tu base desde una URL (Google Sheets publicado como CSV o API), pégala aquí:
        const URL_GOOGLE_SHEETS_CSV = ""; 

        let registrosBase = [];

        // 1. Normalización total: quita acentos, minúsculas y caracteres especiales
        function normalizarTexto(texto) {
            return (texto || "")
                .toString()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9\s]/g, "");
        }

        // 2. Buscador Dinámico Universal por Palabras Compuestas
        function filtrarRegistros(consulta, datos) {
            const consultaLimpia = normalizarTexto(consulta);
            if (!consultaLimpia.trim()) return datos;

            const palabrasClave = consultaLimpia
                .split(/\s+/)
                .filter(palabra => palabra.length > 0);

            if (palabrasClave.length === 0) return datos;

            return datos.filter(item => {
                // Obtiene el texto unificado de TODAS las columnas de la fila
                const textoFila = normalizarTexto(Object.values(item).join(" "));
                return palabrasClave.every(palabra => textoFila.includes(palabra));
            });
        }

        // 3. Renderizado flexible de filas
        function renderizarTabla(lista) {
            const tbody = document.getElementById("tablaCuerpo");
            const sinResultados = document.getElementById("sinResultados");
            tbody.innerHTML = "";

            document.getElementById("coincidencias").textContent = lista.length;

            if (!lista || lista.length === 0) {
                sinResultados.style.display = "block";
                return;
            }

            sinResultados.style.display = "none";

            lista.forEach(item => {
                const vals = Object.values(item);
                
                // Mapea dinámicamente según la propiedad o la posición de la columna
                const col1 = item.NOMBRE || item.nombre || item.Nombre || vals[0] || "";
                const col2 = item["RUTA COMPLETA"] || item.rutaCompleta || item.RutaCompleta || vals[1] || "";
                const col3 = item["GRUPO RESOLUTOR"] || item.grupoResolutor || item.GrupoResolutor || vals[2] || "";
                const col4 = item["IMPACTO POR DEFECTO"] || item.impacto || item.Impacto || vals[3] || "";

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${col1}</strong></td>
                    <td>${col2}</td>
                    <td>${col3}</td>
                    <td>${col4}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function ejecutarBusqueda() {
            const query = document.getElementById("searchInput").value;
            const filtrados = filtrarRegistros(query, registrosBase);
            renderizarTabla(filtrados);
        }

        function limpiarBusqueda() {
            document.getElementById("searchInput").value = "";
            renderizarTabla(registrosBase);
        }

        // 4. Conexión y sincronización de datos
        async function sincronizarBase() {
            if (URL_GOOGLE_SHEETS_CSV.trim() !== "") {
                try {
                    const res = await fetch(URL_GOOGLE_SHEETS_CSV);
                    const text = await res.text();
                    registrosBase = parsearCSV(text);
                } catch (e) {
                    console.error("Error cargando Google Sheets:", e);
                }
            }
            document.getElementById("totalRegistros").textContent = registrosBase.length;
            ejecutarBusqueda();
        }

        function parsearCSV(csvText) {
            const lineas = csvText.split(/\r\n|\n/).filter(l => l.trim() !== "");
            if (lineas.length < 2) return [];
            const cabeceras = lineas[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
            return lineas.slice(1).map(linea => {
                const valores = linea.split(",").map(v => v.trim().replace(/^"|"$/g, ''));
                let obj = {};
                cabeceras.forEach((c, i) => obj[c] = valores[i] || "");
                return obj;
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            sincronizarBase();
        });
    </script>
</body>
</html>
