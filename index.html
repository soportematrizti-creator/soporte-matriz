<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX_OS // PROACTIVANET MATRIX</title>
    <style>
        :root {
            --bg-color: #060c14;
            --card-bg: #0b1522;
            --border-color: #1a293d;
            --text-primary: #e0f2fe;
            --text-secondary: #7dd3fc;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-magenta: #ff0055;
            --table-hover: #112236;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-icon {
            color: var(--accent-cyan);
            font-size: 1.5rem;
        }

        h1 {
            font-size: 1.4rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent-cyan);
        }

        /* BOTÓN SINCRONIZAR BASE (Enciende en verde al pasar el mouse) */
        .btn-sync {
            background: transparent;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .btn-sync:hover {
            background-color: rgba(0, 255, 136, 0.12);
            color: var(--accent-green) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 14px rgba(0, 255, 136, 0.5);
            transform: translateY(-1px);
        }

        /* BUSCADOR */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
            flex-grow: 1;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .btn-clear {
            background: transparent;
            color: var(--accent-magenta);
            border: 1px solid var(--accent-magenta);
            padding: 0 24px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .btn-clear:hover {
            background-color: rgba(255, 0, 85, 0.15);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        /* STATS */
        .stats-bar {
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .stats-bar span {
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* TABLA */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--card-bg);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: rgba(15, 23, 42, 0.9);
            color: var(--accent-cyan);
            padding: 14px 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.8rem;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
            color: var(--text-primary);
            vertical-align: middle;
            line-height: 1.4;
        }

        tr:hover td {
            background-color: var(--table-hover);
        }

        td strong {
            color: #ffffff;
        }

        .no-results {
            padding: 40px;
            text-align: center;
            color: #64748b;
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-container">
            <span class="title-icon">⚡</span>
            <h1><span>MATRIX_OS</span> // PROACTIVANET MATRIX</h1>
        </div>
        <button id="btnSync" class="btn-sync" onclick="sincronizarBase()">
            🔄 SINCRONIZAR BASE
        </button>
    </header>

    <div class="search-box">
        <div class="input-wrapper">
            <span class="search-icon">🔍</span>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Escribe para buscar (ej: baja forzada, conciliacion bancaria)..." 
                oninput="ejecutarBusqueda()"
            >
        </div>
        <button class="btn-clear" onclick="limpiarBusqueda()">💥 LIMPIAR</button>
    </div>

    <div class="stats-bar">
        TOTAL REGISTROS: <span id="totalRegistros">0</span> &nbsp;|&nbsp; COINCIDENCIAS: <span id="coincidencias">0</span>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">NOMBRE</th>
                    <th style="width: 40%;">RUTA COMPLETA</th>
                    <th style="width: 20%;">GRUPO RESOLUTOR</th>
                    <th style="width: 15%;">IMPACTO POR DEFECTO</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
        <div id="sinResultados" class="no-results">
            No se encontraron registros que coincidan con la búsqueda.
        </div>
    </div>
</div>

<script>
    // URL CSV pública de tu matriz en Google Sheets
    const URL_GOOGLE_SHEETS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRLt733uUKhr5iUb1ji-1prDkbGtdBG7BTQM26CAiSzSNpUDk_lEky9nA3TsXeORHKlzj67qw35HGzF/pub?output=csv";

    let registrosBase = [];

    // 1. Normalización de texto: elimina acentos, convierte guiones/diagonales a espacios y limpia texto
    function normalizarTexto(texto) {
        return (texto || "")
            .toString()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "") // Remueve acentos / tildes
            .replace(/[^a-z0-9]/g, " ")      // Convierte caracteres especiales, diagonales y parentesis en espacios
            .replace(/\s+/g, " ")            // Reduce espacios multiples a uno solo
            .trim();
    }

    // 2. Buscador multipalabra flexible
    function filtrarRegistros(consulta, datos) {
        const queryLimpia = normalizarTexto(consulta);
        if (!queryLimpia) return datos;

        const palabrasClave = queryLimpia.split(" ").filter(p => p.length > 0);

        return datos.filter(item => {
            const textoFila = normalizarTexto(Object.values(item).join(" "));
            return palabrasClave.every(palabra => textoFila.includes(palabra));
        });
    }

    // 3. Renderizado de tabla con mapeo inteligente de columnas
    function renderizarTabla(lista) {
        const tbody = document.getElementById("tablaCuerpo");
        const sinResultados = document.getElementById("sinResultados");
        tbody.innerHTML = "";

        document.getElementById("coincidencias").textContent = lista.length;

        if (!lista || lista.length === 0) {
            sinResultados.style.display = "block";
            return;
        }

        sinResultados.style.display = "none";

        lista.forEach(item => {
            const vals = Object.values(item);
            
            const col1 = item.Nombre || item.NOMBRE || item.nombre || vals[0] || "";
            const col2 = item["Ruta completa"] || item.RutaCompleta || item["RUTA COMPLETA"] || item["Ruta Completa"] || vals[1] || "";
            const col3 = item["Grupo Resolutor"] || item.GrupoResolutor || item["GRUPO RESOLUTOR"] || item["Grupo resolutor"] || vals[2] || "";
            const col4 = item["Impacto por defecto"] || item.Impacto || item["IMPACTO POR DEFECTO"] || item["Impacto Por Defecto"] || vals[3] || "";

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${col1}</strong></td>
                <td>${col2}</td>
                <td>${col3}</td>
                <td>${col4}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function ejecutarBusqueda() {
        const query = document.getElementById("searchInput").value;
        const filtrados = filtrarRegistros(query, registrosBase);
        renderizarTabla(filtrados);
    }

    function limpiarBusqueda() {
        document.getElementById("searchInput").value = "";
        renderizarTabla(registrosBase);
    }

    // 4. Lector CSV (Maneja comillas y saltos de línea dentro de celdas)
    function parsearCSV(texto) {
        const lineas = [];
        let fila = [];
        let dentroDeComillas = false;
        let valor = '';

        for (let i = 0; i < texto.length; i++) {
            const c = texto[i];
            const siguiente = texto[i + 1];

            if (c === '"') {
                if (dentroDeComillas && siguiente === '"') {
                    valor += '"';
                    i++;
                } else {
                    dentroDeComillas = !dentroDeComillas;
                }
            } else if (c === ',' && !dentroDeComillas) {
                fila.push(valor.trim());
                valor = '';
            } else if ((c === '\r' || c === '\n') && !dentroDeComillas) {
                if (c === '\r' && siguiente === '\n') i++;
                fila.push(valor.trim());
                if (fila.some(campo => campo !== '')) lineas.push(fila);
                fila = [];
                valor = '';
            } else {
                valor += c;
            }
        }
        if (valor || fila.length > 0) {
            fila.push(valor.trim());
            if (fila.some(campo => campo !== '')) lineas.push(fila);
        }

        if (lineas.length < 2) return [];
        const cabeceras = lineas[0].map(h => h.replace(/^"|"$/g, ''));
        return lineas.slice(1).map(f => {
            let obj = {};
            cabeceras.forEach((c, idx) => obj[c] = (f[idx] || "").replace(/^"|"$/g, ''));
            return obj;
        });
    }

    // 5. Carga y sincronización de base de datos
    async function sincronizarBase() {
        const btnSync = document.getElementById("btnSync");
        if (btnSync) btnSync.style.opacity = "0.5";

        try {
            const res = await fetch(URL_GOOGLE_SHEETS_CSV);
            const text = await res.text();
            
            // Filtro de seguridad anti-scripts de Google
            if (text.trim().startsWith("function") || text.trim().startsWith("<!DOCTYPE") || text.trim().startsWith("<script")) {
                console.error("Respuesta no válida recibida de la URL.");
                return;
            }

            registrosBase = parsearCSV(text);
        } catch (e) {
            console.error("Error al sincronizar con Google Sheets:", e);
        } finally {
            if (btnSync) btnSync.style.opacity = "1";
        }

        document.getElementById("totalRegistros").textContent = registrosBase.length;
        ejecutarBusqueda();
    }

    document.addEventListener("DOMContentLoaded", () => {
        sincronizarBase();
    });
</script>

</body>
</html>
