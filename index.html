<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX_OS // Ticket Classification Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020813;
            --blue-glow: #00d9ff;
            --blue-cyan: #0077ff;
            --pink-neon: #ff0055;
            --card-bg: rgba(6, 18, 38, 0.7);
            --border-glow: rgba(0, 217, 255, 0.3);
            --text-main: #e0f7fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 217, 255, 0.1) 0%, transparent 70%),
                linear-gradient(to bottom, rgba(2, 8, 19, 0.9), rgba(2, 8, 19, 0.95));
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.15);
            padding: 25px;
            border-radius: 4px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 15px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--blue-glow);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .brand span {
            color: #ffffff;
        }

        .btn-sync {
            background: transparent;
            border: 1px solid var(--blue-glow);
            color: var(--blue-glow);
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sync:hover {
            background: var(--blue-glow);
            color: var(--bg-deep);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
        }

        /* Controls / Search Bar */
        .search-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(2, 12, 27, 0.8);
            border: 1px solid var(--border-glow);
            padding: 14px 20px 14px 45px;
            color: #fff;
            font-size: 18px;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--blue-glow);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
        }

        .input-wrapper::before {
            content: "🔍";
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }

        .btn-clear {
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--pink-neon);
            color: var(--pink-neon);
            padding: 0 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: var(--pink-neon);
            color: #fff;
            box-shadow: 0 0 15px rgba(ff, 0, 85, 0.6);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #8ab4f8;
        }

        .stats-bar span {
            color: var(--blue-glow);
            font-weight: 700;
        }

        /* Data Table */
        .table-container {
            border: 1px solid var(--border-glow);
            overflow-x: auto;
            background: rgba(2, 8, 19, 0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 217, 255, 0.08);
            color: var(--blue-glow);
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            padding: 15px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-glow);
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid rgba(0, 217, 255, 0.1);
            font-size: 16px;
        }

        tr:hover {
            background: rgba(0, 217, 255, 0.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            font-family: 'Orbitron', sans-serif;
            color: var(--blue-glow);
            letter-spacing: 2px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                ⚡ MATRIX_OS <span>// PROACTIVANET MATRIX</span>
            </div>
            <button class="btn-sync" onclick="sincronizarBase()">
                🔄 SINCRONIZAR BASE
            </button>
        </div>

        <!-- Search Inputs -->
        <div class="search-container">
            <div class="input-wrapper">
                <input type="text" id="searchInput" placeholder="Escribe para buscar (ej: conciliacion bancaria)..." oninput="ejecutarBusqueda()">
            </div>
            <button class="btn-clear" onclick="limpiarBusqueda()">💥 LIMPIAR</button>
        </div>

        <!-- Stats Counter -->
        <div class="stats-bar">
            <div>TOTAL REGISTROS: <span id="totalRegistros">0</span></div>
            <div>|</div>
            <div>COINCIDENCIAS: <span id="coincidencias">0</span></div>
        </div>

        <!-- Data Display Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>NOMBRE</th>
                        <th>RUTA COMPLETA</th>
                        <th>GRUPO RESOLUTOR</th>
                        <th>IMPACTO POR DEFECTO</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo">
                    <!-- Filas renderizadas por JS -->
                </tbody>
            </table>
            <div id="sinResultados" class="empty-state" style="display: none;">
                NO SE ENCONTRARON COINCIDENCIAS
            </div>
        </div>
    </div>

    <script>
        // Base de datos (Se puede actualizar dinámicamente desde API / Google Sheets)
        let registrosBase = [
            { nombre: "Conciliación Bancaria Diaria", rutaCompleta: "Finanzas / Tesorería / Conciliación", grupoResolutor: "Soporte Finanzas", impacto: "Medio" },
            { nombre: "Apertura de Caja POS", rutaCompleta: "Punto de Venta / Cajas / Operación", grupoResolutor: "Mesa POS", impacto: "Alto" },
            { nombre: "Error en Depósito Bancario", rutaCompleta: "Finanzas / Bancos / Conciliación", grupoResolutor: "Soporte Finanzas", impacto: "Alto" },
            { nombre: "Fallo de Impresora Fiscal", rutaCompleta: "Hardware / Periféricos / Impresoras", grupoResolutor: "Soporte Campo", impacto: "Bajo" }
        ];

        // 1. Normalizador de texto: Remueve acentos, convierte a minúsculas y elimina caracteres especiales
        function normalizarTexto(texto) {
            return (texto || "")
                .toString()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") // Elimina tildes/acentos
                .replace(/[^a-z0-9\s]/g, "");    // Elimina signos y puntuación
        }

        // 2. Motor de búsqueda para palabras compuestas y frases
        function filtrarRegistros(consulta, datos) {
            const consultaLimpia = normalizarTexto(consulta);
            if (!consultaLimpia.trim()) return datos;

            // Divide la consulta por espacios descartando conectores o letras de 1 carácter
            const palabrasClave = consultaLimpia
                .split(/\s+/)
                .filter(palabra => palabra.length > 1);

            if (palabrasClave.length === 0) return datos;

            return datos.filter(item => {
                // Junta los campos visibles en un solo string para buscar en todos
                const campoCompleto = normalizarTexto(
                    `${item.nombre} ${item.rutaCompleta} ${item.grupoResolutor} ${item.impacto}`
                );

                // Comprueba que TODAS las palabras clave ingresadas existan en el registro
                return palabrasClave.every(palabra => campoCompleto.includes(palabra));
            });
        }

        // 3. Renderizado de la tabla
        function renderizarTabla(lista) {
            const tbody = document.getElementById("tablaCuerpo");
            const sinResultados = document.getElementById("sinResultados");
            tbody.innerHTML = "";

            document.getElementById("coincidencias").textContent = lista.length;

            if (lista.length === 0) {
                sinResultados.style.display = "block";
                return;
            }

            sinResultados.style.display = "none";
            lista.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.rutaCompleta}</td>
                    <td>${item.grupoResolutor}</td>
                    <td>${item.impacto}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. Controladores de Eventos
        function ejecutarBusqueda() {
            const valorInput = document.getElementById("searchInput").value;
            const resultados = filtrarRegistros(valorInput, registrosBase);
            renderizarTabla(resultados);
        }

        function limpiarBusqueda() {
            document.getElementById("searchInput").value = "";
            renderizarTabla(registrosBase);
        }

        function sincronizarBase() {
            // Espacio para refrescar datos desde backend o Google Sheets API
            document.getElementById("totalRegistros").textContent = registrosBase.length;
            ejecutarBusqueda();
        }

        // Inicializar
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("totalRegistros").textContent = registrosBase.length;
            renderizarTabla(registrosBase);
        });
    </script>
</body>
</html>
